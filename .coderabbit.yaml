reviews:
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    base_branches:
      - main
  path_instructions:
    - path: "frontend/**"
      instructions: "Flag missing TypeScript types as HIGH. Flag missing React prop validation as MEDIUM. Check component structure and unused imports."
    - path: "**"
      instructions: "Flag security issues like hardcoded secrets, XSS vulnerabilities, and client-side data exposure as HIGH."